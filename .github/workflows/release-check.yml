name: Release Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-check:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Firestore rules contract
        run: npm run test:rules

      - name: Privacy scan
        run: npm run privacy:scan

      - name: Release check
        run: npm run release:check
